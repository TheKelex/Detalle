<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffb3c1">
  <title>Para Vanesa</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="./assets/js/script.js" defer></script>
</head>
<body>
  <main id="acceso" class="acceso">
    <form id="form-acceso" class="tarjeta-acceso" novalidate>
      <span class="sello-acceso heart" aria-hidden="true"></span>
      <h1 class="titulo-acceso">Un detallito para ti</h1>
      <p class="texto-acceso">Para abrir tu cartita, escribe la fecha en que empezó nuestra historia.</p>
      <label for="fecha-acceso">Fecha de inicio de nuestro noviazgo</label>
      <input
        id="fecha-acceso"
        name="fecha"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="DD/MM/AAAA"
        maxlength="10"
        aria-describedby="ayuda-acceso error-acceso"
        required
      >
      <span id="ayuda-acceso" class="ayuda-acceso">Escríbela con el formato día/mes/año.</span>
      <p id="error-acceso" class="error-acceso" aria-live="polite"></p>
      <button class="btn-acceso" type="submit">Entrar</button>
    </form>
  </main>

  <main id="hub" class="hub" hidden>
    <div class="hub-ambiente" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <header class="hub-cabecera">
      <span class="hub-corazon heart" aria-hidden="true"></span>
      <h1 class="titulo-acceso">Un rinconcito para nosotros</h1>
      <p class="texto-acceso">Elige un detalle para abrirlo :3</p>
    </header>
    <section class="hub-detalles" aria-label="Detalles disponibles">
      <button id="abrir-vanesa" class="tarjeta-detalle" type="button">
        <span class="detalle-icono heart" aria-hidden="true"></span>
        <span class="detalle-titulo">Para mi amongucita</span>
        <span class="detalle-descripcion">Una cartita llena de recuerdos y mucho amor.</span>
        <span class="detalle-accion">Ver detalle</span>
      </button>
      <button id="abrir-dos-meses" class="tarjeta-detalle" type="button">
        <span class="detalle-icono lotus-mini" aria-hidden="true">✿</span>
        <span class="detalle-titulo">Dos meses floreciendo contigo</span>
        <span class="detalle-descripcion">Una sorpresa rosadita inspirada en tus flores de loto favoritas.</span>
        <span class="detalle-accion">Ver detalle</span>
      </button>
    </section>
    <p id="error-hub" class="error-acceso" aria-live="polite"></p>
  </main>

  <div id="carga-experiencia" hidden></div>

</body>
</html>
